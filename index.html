<!doctype html>
<html lang="en" class="intro-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mansor Customs</title>
    <meta name="description" content="Mansor Customs: vehicle wraps, paint protection film, ceramic coating, bespoke interiors and performance builds in Garfield, New Jersey." />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Social previews (WhatsApp, Instagram DMs, Facebook, iMessage, X…).
         %SITE_URL% is filled at build time (vite.config.ts): Netlify's URL, or SITE_URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mansor Customs" />
    <meta property="og:title" content="Mansor Customs" />
    <meta property="og:description" content="Vehicle wraps, paint protection, ceramic coating, bespoke interiors and performance builds in Garfield, New Jersey." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mansor Customs logo on black" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mansor Customs" />
    <meta name="twitter:description" content="Vehicle wraps, paint protection, ceramic coating, bespoke interiors and performance builds in Garfield, New Jersey." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Mansor Customs logo on black" />

    <!-- Icons from the official logo: M monogram for tab sizes, the badge for app icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/michroma-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Paint black before any CSS/JS arrives, so the intro starts from a clean black frame -->
    <style>html { background: #0b0b0c; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
